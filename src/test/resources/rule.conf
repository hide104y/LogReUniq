################################################################################
# 集約ルール
################################################################################
# 正規表現（複数指定可能）
# ---> 引数：-r regex
RegexRule = ^.*\(SERVICE_NAME=([^\)]+)\).*\(HOST=([^\)]+)\).*\(HOST=([^\)]+)\).*$
RegexRule = ^.*\(HOST=([^\)]+)\).*\(SERVICE_NAME=([^\)]+)\).*\(HOST=([^\)]+)\).*$
RegexRule = ^.*\(HOST=([^\)]+)\).*\(HOST=([^\)]+)\).*\(SERVICE_NAME=([^\)]+)\).*$
RegexRule = ^.*\(SID=([^\)]+)\).*\(HOST=([^\)]+)\).*\(HOST=([^\)]+)\).*$
RegexRule = ^.*\(HOST=([^\)]+)\).*\(SID=([^\)]+)\).*\(HOST=([^\)]+)\).*$
RegexRule = ^.*\(HOST=([^\)]+)\).*\(HOST=([^\)]+)\).*\(SID=([^\)]+)\).*$
# 上述正規表現で指定したキャプチャグループの抽出順序（複数指定可能）
# ---> 引数：--order csv
Order = 2,3,1
Order = 1,3,2
Order = 1,2,3
Order = 2,3,1
Order = 1,3,2
Order = 1,2,3
# PRE除外正規表現（複数指定可能）
# ---> 引数：--pre-exc regex
PreExcRegex = ^.*\(USER=grid1\).*$
PreExcRegex = ^.*\(COMMAND=status\).*$
# POST除外正規表現（複数指定可能）
# ---> 引数：--post-exc regex
PostExcRegex = ^.*\(USER=grid2\).*$
PostExcRegex = ^.*\(COMMAND=status\).*$
IsCaseInSensitive = true
################################################################################
# ファイル名の絞込／除外
################################################################################
# 絞込
# ---> 引数：--inc csv
IncFiles = ^list.*
